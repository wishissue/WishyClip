name: Bug Report
description: File a bug or unexpected behavior report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android Version
      description: e.g. Android 14
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model
      description: e.g. Pixel 7, Galaxy S23
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we replicate this issue?
    validations:
      required: true
