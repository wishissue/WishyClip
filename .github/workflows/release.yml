name: Release

# Every push to main builds ONE signed universal APK and publishes it as a GitHub Release.
# The app's updater looks for exactly this file:  WishyClip-<version>.apk  (+ .sha256)

on:
  push:
    branches: [main]

permissions:
  contents: write

# Never run two releases at once (keeps "latest" in the right order).
concurrency:
  group: release
  cancel-in-progress: false

env:
  BASE_VERSION: "1.2"   # change to 1.3, 2.0 ... when you want a bigger version

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set version
        run: echo "VERSION=${BASE_VERSION}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Check signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing GitHub secret: $v"; exit 1; fi
          done

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed universal release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PappVersionName=$VERSION

      - name: Name the file the way the app's updater expects
        run: |
          cd app/build/outputs/apk/release
          if ls *unsigned* >/dev/null 2>&1; then echo "APK is unsigned - check the 4 secrets"; exit 1; fi
          if [ ! -f app-release.apk ]; then echo "Expected app-release.apk was not produced"; ls -l; exit 1; fi
          mv app-release.apk "WishyClip-${VERSION}.apk"
          sha256sum "WishyClip-${VERSION}.apk" > "WishyClip-${VERSION}.apk.sha256"
          ls -l

      - name: Verify the APK (signature and version)
        run: |
          APK="app/build/outputs/apk/release/WishyClip-${VERSION}.apk"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "::warning::Android build-tools not found; skipping APK verification"; exit 0; fi
          "$BT/apksigner" verify --verbose "$APK"
          GOT=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "APK versionName: $GOT (expected $VERSION)"
          if [ "$GOT" != "$VERSION" ]; then echo "Version mismatch"; exit 1; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: WishyClip ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/WishyClip-${{ env.VERSION }}.apk
            app/build/outputs/apk/release/WishyClip-${{ env.VERSION }}.apk.sha256

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
