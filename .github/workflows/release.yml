name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  BASE_VERSION: "1.2"   # change to 1.3, 2.0 ... when you want a bigger version

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set version
        run: echo "VERSION=${BASE_VERSION}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Restore keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PappVersionName=$VERSION

      - name: Name files the way the app's updater expects
        run: |
          cd app/build/outputs/apk/release
          if ls *unsigned* >/dev/null 2>&1; then echo "APK is unsigned - check the 4 secrets"; exit 1; fi
          for f in app-*-release.apk; do
            abi=${f#app-}; abi=${abi%-release.apk}
            new="WishyClip-${VERSION}-${abi}-release.apk"
            mv "$f" "$new"
            sha256sum "$new" > "$new.sha256"
          done
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: WishyClip ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/WishyClip-*.apk
            app/build/outputs/apk/release/WishyClip-*.sha256
